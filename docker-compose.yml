services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: coach
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coach -d coach']
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
